<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DarkBound • Beta Key Generator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:#090b10;
    color:#fff;
}

.card{
    width:min(92%,520px);
    padding:32px;
    border:1px solid #252a35;
    border-radius:20px;
    background:#11151d;
    box-shadow:0 20px 60px #0008;
}

h1{
    margin:0 0 8px;
    font-size:28px;
}

p{
    color:#9da6b5;
    margin-top:0;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#fff;
    color:#111;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

textarea{
    width:100%;
    height:180px;
    margin-top:18px;
    padding:14px;
    resize:none;
    background:#090b10;
    color:#dce3ee;
    border:1px solid #303744;
    border-radius:10px;
    font-family:monospace;
    font-size:14px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

label{
    display:block;
    margin-top:18px;
    color:#aeb7c6;
    font-size:14px;
}

input{
    width:100%;
    margin-top:7px;
    padding:12px;
    border-radius:9px;
    border:1px solid #303744;
    background:#090b10;
    color:#fff;
    font-size:15px;
}

.status{
    min-height:20px;
    margin-top:12px;
    color:#8fe3a3;
    font-size:14px;
}
</style>
</head>

<body>

<div class="card">

    <h1>🎮 DarkBound Beta</h1>

    <p>Gerador de chaves para testes fechados.</p>

    <label>Quantidade de keys</label>

    <input
        id="amount"
        type="number"
        min="1"
        max="100"
        value="5"
    >

    <div class="row">

        <button
            id="generateButton"
            onclick="generate()"
        >
            GERAR KEYS
        </button>

        <button onclick="copyKeys()">
            COPIAR
        </button>

    </div>

    <textarea
        id="keys"
        readonly
        placeholder="As keys aparecerão aqui..."
    ></textarea>

    <div id="status" class="status"></div>

</div>

<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://lbqlrwujudpnlgjjttat.supabase.co";

const SUPABASE_KEY =
"sb_publishable_au9FS37ayZs1ChR-A0DrTQ_JOKZILhh";


/* =================================
   GERAR PARTE ALEATÓRIA
================================= */

function randomPart(length){

    const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    const bytes =
    new Uint8Array(length);

    crypto.getRandomValues(bytes);

    let resultado = "";

    for(let i = 0; i < length; i++){

        resultado +=
        chars[bytes[i] % chars.length];

    }

    return resultado;
}


/* =================================
   GERAR KEYS
================================= */

async function generate(){

    const button =
    document.getElementById("generateButton");

    const status =
    document.getElementById("status");

    const textarea =
    document.getElementById("keys");

    const amountInput =
    document.getElementById("amount");

    const amount =
    Math.min(
        100,
        Math.max(
            1,
            Number(amountInput.value) || 1
        )
    );

    button.disabled = true;

    status.textContent =
    "Gerando e salvando as keys...";

    textarea.value = "";

    const keys = [];

    for(let i = 0; i < amount; i++){

        const key =
        "DARKBOUND-BETA-" +
        randomPart(4) +
        "-" +
        randomPart(4);

        keys.push(key);
    }

    try{

        const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/beta_keys",
            {
                method:"POST",

                headers:{
                    "apikey":SUPABASE_KEY,

                    "Authorization":
                    "Bearer " + SUPABASE_KEY,

                    "Content-Type":
                    "application/json",

                    "Prefer":
                    "return=minimal"
                },

                body:JSON.stringify(
                    keys.map(function(key){

                        return {
                            key:key,
                            used:false
                        };

                    })
                )
            }
        );

        if(!response.ok){

            const erro =
            await response.text();

            console.error(
                "Erro Supabase:",
                erro
            );

            throw new Error(
                "Não foi possível salvar as Keys."
            );
        }

        textarea.value =
        keys.join("\n");

        status.textContent =
        amount +
        " key(s) gerada(s) e salva(s) no banco!";

    }catch(error){

        console.error(error);

        textarea.value = "";

        status.textContent =
        "❌ Erro ao salvar as Keys.";

    }

    button.disabled = false;
}


/* =================================
   COPIAR KEYS
================================= */

async function copyKeys(){

    const textarea =
    document.getElementById("keys");

    const status =
    document.getElementById("status");

    const text =
    textarea.value;

    if(!text){

        status.textContent =
        "Gere uma key primeiro.";

        return;
    }

    try{

        await navigator.clipboard.writeText(text);

        status.textContent =
        "✅ Keys copiadas!";

    }catch(error){

        textarea.select();

        document.execCommand("copy");

        status.textContent =
        "✅ Keys copiadas!";

    }
}

</script>

</body>
</html>
