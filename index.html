<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DarkBound • Beta Key Generator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#090b10;color:#fff}.card{width:min(92%,520px);padding:32px;border:1px solid #252a35;border-radius:20px;background:#11151d;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:28px}p{color:#9da6b5;margin-top:0}button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:bold;font-size:16px;cursor:pointer}button:hover{opacity:.9}textarea{width:100%;height:180px;margin-top:18px;padding:14px;resize:none;background:#090b10;color:#dce3ee;border:1px solid #303744;border-radius:10px;font-family:monospace;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin-top:18px;color:#aeb7c6;font-size:14px}input{width:100%;margin-top:7px;padding:12px;border-radius:9px;border:1px solid #303744;background:#090b10;color:#fff;font-size:15px}.status{min-height:20px;margin-top:12px;color:#8fe3a3;font-size:14px}</style></head><body><div class="card"><h1>🎮 DarkBound Beta</h1><p>Gerador de chaves para testes fechados.</p><label>Quantidade de keys</label><input id="amount" type="number" min="1" max="100" value="5"><div class="row"><button onclick="generate()">GERAR KEYS</button><button onclick="copyKeys()">COPIAR</button></div><textarea id="keys" readonly placeholder="As keys aparecerão aqui..."></textarea><div id="status" class="status"></div></div><script>function randomPart(length){const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const bytes=new Uint8Array(length);crypto.getRandomValues(bytes);let out="";for(let i=0;i<length;i++)out+=chars[bytes[i]%chars.length];return out}function generate(){const amount=Math.min(100,Math.max(1,Number(document.getElementById("amount").value)||1));const keys=[];for(let i=0;i<amount;i++)keys.push("DARKBOUND-BETA-"+randomPart(4)+"-"+randomPart(4));document.getElementById("keys").value=keys.join("\n");document.getElementById("status").textContent=amount+" key(s) gerada(s)."}async function copyKeys(){const text=document.getElementById("keys").value;if(!text){document.getElementById("status").textContent="Gere uma key primeiro.";return}await navigator.clipboard.writeText(text);document.getElementById("status").textContent="Keys copiadas!"}</script></body></html>
